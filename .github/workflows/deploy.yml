name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            # Thiếu set -e trước đây: nếu git pull/npm ci/build lỗi, script vẫn chạy tiếp
            # xuống pm2 restart (container/process CŨ đứng dậy lại bình thường), health
            # check pass nhờ bản CŨ, CI báo "success" giả dù code mới chưa hề lên server.
            cd ~/TaleX-FE-KLTN
            git fetch origin main
            git reset --hard origin/main

            # Create .env.local from GitHub Secrets
            cat > .env.local << ENVEOF
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_AI_RECOMMENDATION_API_URL=${{ secrets.NEXT_PUBLIC_AI_RECOMMENDATION_API_URL }}
            ENVEOF

            sed -i 's/^[[:space:]]*//' .env.local

            # Install deps when manifests changed or node_modules is missing/incomplete.
            if [ ! -d node_modules ] || \
               [ ! -d node_modules/xlsx ] || \
               ! diff -q package.json /tmp/talex-fe-pkg.json 2>/dev/null || \
               ! diff -q package-lock.json /tmp/talex-fe-lock.json 2>/dev/null; then
              npm cache clean --force || true
              npm ci --registry=https://registry.npmjs.org/
              cp package.json /tmp/talex-fe-pkg.json
              cp package-lock.json /tmp/talex-fe-lock.json
            fi

            # Clean old build cache to prevent disk bloat
            rm -rf .next

            # Build Next.js
            npm run build

            # Graceful restart (no downtime if already running)
            pm2 restart talex-fe --update-env 2>/dev/null || \
              pm2 start npm --name "talex-fe" -- start -- -p 3000
            pm2 save

            # Health check — wait up to 60s
            echo "Waiting for frontend health check..."
            for i in $(seq 1 12); do
              if curl -sf http://localhost:3000 > /dev/null 2>&1; then
                echo "Frontend is healthy!"
                exit 0
              fi
              echo "  attempt $i/12..."
              sleep 5
            done
            # Lệnh cuối trước đây là echo (luôn exit 0) — CI báo xanh dù health check thật
            # sự timeout. exit 1 để CI báo đỏ đúng.
            echo "WARNING: Frontend health check failed after 60s"
            exit 1
